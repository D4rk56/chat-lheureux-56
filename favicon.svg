<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d24de3"/>
      <stop offset="100%" stop-color="#7db1f9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Fond circulaire doux -->
  <rect width="100" height="100" rx="28" fill="url(#brandGrad)"/>
  
  <!-- Silhouette chat mignonne blanche -->
  <g fill="#ffffff" filter="url(#shadow)">
    <!-- Tête et oreilles -->
    <path d="M 28 42 L 34 22 C 34.5 20.5 37 21 38 23 L 44 34 C 46 33.5 48 33 50 33 C 52 33 54 33.5 56 34 L 62 23 C 63 21 65.5 20.5 66 22 L 72 42 C 78 51 77 65 69 72 C 63 77 37 77 31 72 C 23 65 22 51 28 42 Z"/>
    
    <!-- Intérieur oreilles rose doux -->
    <path d="M 35 25 L 31 40 C 33 36 36 33 40 32 Z" fill="#fbcfe8" opacity="0.8"/>
    <path d="M 65 25 L 69 40 C 67 36 64 33 60 32 Z" fill="#fbcfe8" opacity="0.8"/>
    
    <!-- Yeux bienveillants fermés ou ronds -->
    <circle cx="41" cy="50" r="3.5" fill="#4a044e"/>
    <circle cx="59" cy="50" r="3.5" fill="#4a044e"/>
    <circle cx="42" cy="49" r="1" fill="#ffffff"/>
    <circle cx="60" cy="49" r="1" fill="#ffffff"/>

    <!-- Petit nez en cœur -->
    <path d="M 50 56 C 49 54.5 46.5 55 47 57 C 47.5 58.5 50 60.5 50 60.5 C 50 60.5 52.5 58.5 53 57 C 53.5 55 51 54.5 50 56 Z" fill="#ec4899"/>
    
    <!-- Bouche et moustaches -->
    <path d="M 47 60 Q 45 63 43 62" stroke="#4a044e" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 53 60 Q 55 63 57 62" stroke="#4a044e" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <line x1="33" y1="52" x2="23" y2="50" stroke="#ec4899" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="33" y1="56" x2="24" y2="58" stroke="#ec4899" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="67" y1="52" x2="77" y2="50" stroke="#ec4899" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="67" y1="56" x2="76" y2="58" stroke="#ec4899" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Petit cœur d'amour flottant -->
  <path d="M 74 24 C 72 21 68 22 68 25 C 68 28 74 32 74 32 C 74 32 80 28 80 25 C 80 22 76 21 74 24 Z" fill="#f43f5e"/>
</svg>
