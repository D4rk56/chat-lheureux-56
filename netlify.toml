[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_PATHS = "legacy_html"

# Edge functions pour réseaux sociaux & images dynamiques
[[edge_functions]]
  path = "/chat-detail*"
  function = "og-preview"

[[edge_functions]]
  path = "/chat/*"
  function = "og-preview"

[[edge_functions]]
  path = "/api/cat-image*"
  function = "og-preview"

# API Functions
[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200

# Proxy Firebase Auth pour le même domaine (résout l'erreur 'The requested action is invalid')
[[redirects]]
  from = "/__/auth/*"
  to = "https://chat-lheureux-56.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

# SPA Fallback pour React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200