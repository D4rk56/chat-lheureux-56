[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Edge functions pour réseaux sociaux & images dynamiques
[[edge_functions]]
  path = "/chat-detail*"
  function = "og-preview"

[[edge_functions]]
  path = "/chat/*"
  function = "og-preview"

[[edge_functions]]
  path = "/api/cat-image*"
  function = "og-preview"

# API Functions
[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200

# SPA Fallback pour React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200