<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Redirection — Fiche chat</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (id) {
      window.location.replace('/chat/' + encodeURIComponent(id));
    } else {
      window.location.replace('/adoption');
    }
  </script>
  <meta http-equiv="refresh" content="0; url=/adoption">
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">
  <p>Redirection vers <a href="/adoption">la fiche du chat</a>...</p>
</body>
</html>
